name: Schannel trace (temporary)

on:
  push:
    branches: [schannel-client]

jobs:
  trace:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install ooRexx
        run: |
          . scripts/oorexx-version.sh
          name="oorexx-5.3.0-$OOREXX_REV.windows.x86_64-portable-release"
          curl -fsSL --retry 3 -o oorexx.zip \
            "https://downloads.sourceforge.net/project/oorexx/oorexx/5.3.0beta/portable/$name.zip"
          7z x -y -o"$RUNNER_TEMP/oorexx" oorexx.zip > /dev/null
          echo "OOREXX_HOME=$RUNNER_TEMP/oorexx/$name" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/oorexx/$name/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-openssl-x64-windows-static-md-v2
      - name: OpenSSL
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          export VCPKG_BINARY_SOURCES="clear;files,$(cygpath -w "$RUNNER_TEMP/vcpkg-cache"),readwrite"
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install openssl:x64-windows-static-md > vcpkg.log 2>&1 || { tail -40 vcpkg.log; exit 1; }
          tc="$(cygpath -m "$VCPKG_INSTALLATION_ROOT")/scripts/buildsystems/vcpkg.cmake"
          echo "CMAKE_EXTRA=-DCMAKE_TOOLCHAIN_FILE=$tc -DVCPKG_TARGET_TRIPLET=x64-windows-static-md" >> "$GITHUB_ENV"
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOOREXX_HOME="$OOREXX_HOME" $CMAKE_EXTRA
          cmake --build build --config Release
      - run: scripts/get-oorexxunit.sh
      - name: DTLS with the trace
        env:
          OOSOCKETS_TRACE: 1
        run: |
          b="$(cygpath -w "$PWD/build/Release")"; t="$(cygpath -w "$PWD/tests")"; f="$(cygpath -w "$PWD/tests/framework")"
          export REXX_PATH="$b;$t;$f" PATH="$PWD/build/Release:$PATH"
          cd tests && rexx run.rex DTLSSocket 2>&1 || true
