name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            build: ubuntu2404.x86_64
          - os: macos-15
            build: macos.arm64.x86_64
          - os: macos-15-intel
            build: macos.arm64.x86_64
          - os: windows-2022
            build: windows.x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # ooRexx: SourceForge's portable build of the revision in
      # scripts/oorexx-version.sh (the family's; see oorexx-bridges).
      - name: Install ooRexx
        run: |
          . scripts/oorexx-version.sh
          name="oorexx-5.3.0-$OOREXX_REV.${{ matrix.build }}-portable-release"
          curl -fsSL --retry 3 -o oorexx.zip \
            "https://downloads.sourceforge.net/project/oorexx/oorexx/5.3.0beta/portable/$name.zip"
          dest="$RUNNER_TEMP/oorexx"
          if [ "$RUNNER_OS" = Windows ]; then
            7z x -y -o"$dest" oorexx.zip > /dev/null
          else
            unzip -q oorexx.zip -d "$dest"
          fi
          home="$dest/$name"
          echo "OOREXX_HOME=$home" >> "$GITHUB_ENV"
          echo "$home/bin" >> "$GITHUB_PATH"

      - name: ooRexx version
        run: rexx -v

      # OpenSSL: Linux, the system's; macOS, Homebrew's; Windows, vcpkg's
      # x64-windows (DLLs), cached: building it takes ~7 minutes. Only its
      # headers to build: the library loads OpenSSL when it is first needed
      # (src/ossl.h); on Windows from next to oosockets.dll, where the DLLs
      # are copied (as the release zip has them).
      - name: OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: |
          dpkg -s libssl-dev > /dev/null 2>&1 || sudo apt-get install -y libssl-dev
          openssl version

      - name: OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          p="$(brew --prefix openssl@3)"
          ls "$p/lib/"*.dylib
          "$p/bin/openssl" version
          echo "CMAKE_EXTRA=-DOPENSSL_ROOT_DIR=$p" >> "$GITHUB_ENV"

      - name: vcpkg cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-openssl-x64-windows-v1

      - name: OpenSSL (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          export VCPKG_BINARY_SOURCES="clear;files,$(cygpath -w "$RUNNER_TEMP/vcpkg-cache"),readwrite"
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install openssl:x64-windows > vcpkg.log 2>&1 \
            || { tail -40 vcpkg.log; exit 1; }
          grep -i -m3 -E "openssl:x64-windows|restored" vcpkg.log || true
          tc="$(cygpath -m "$VCPKG_INSTALLATION_ROOT")/scripts/buildsystems/vcpkg.cmake"
          echo "CMAKE_EXTRA=-DCMAKE_TOOLCHAIN_FILE=$tc -DVCPKG_TARGET_TRIPLET=x64-windows" >> "$GITHUB_ENV"
          echo "OPENSSL_BIN=$(cygpath -u "$VCPKG_INSTALLATION_ROOT")/installed/x64-windows/bin" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOOREXX_HOME="$OOREXX_HOME" ${CMAKE_EXTRA:-}
          cmake --build build --config Release
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$OPENSSL_BIN"/libssl-3-x64.dll "$OPENSSL_BIN"/libcrypto-3-x64.dll build/Release/
          fi

      # What the library loads: no OpenSSL (it loads it itself, and nothing
      # of it may be left undefined: on Windows that would not link).
      - name: Dependencies
        run: |
          case "$RUNNER_OS" in
            Linux) scripts/check-unlinked.sh build/liboosockets.so ;;
            macOS) scripts/check-unlinked.sh build/liboosockets.dylib ;;
            Windows) scripts/check-unlinked.sh build/Release/oosockets.dll ;;
          esac

      - name: ooRexxUnit
        run: scripts/get-oorexxunit.sh

      - name: Test
        timeout-minutes: 10
        env:
          OOSOCKETS_ONLINE: 1          # the TLS tests against real servers
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            scripts/test.sh "$PWD/build/Release"
          else
            scripts/test.sh "$PWD/build"
          fi

      # Windows: Schannel does TLS by default; OOSOCKETS_TLS=openssl makes it
      # OpenSSL (Rony, 29/10/2026). Every test again, that way.
      - name: Test with OOSOCKETS_TLS=openssl (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        env:
          OOSOCKETS_ONLINE: 1
          OOSOCKETS_TLS: openssl
        run: scripts/test.sh "$PWD/build/Release"

      # Windows without OpenSSL (OOSOCKETS_OPENSSL naming a directory without
      # it): everything Schannel does works, certificate files included; the
      # DTLS server and OOSOCKETS_TLS=openssl say what is missing. Then
      # OOSOCKETS_OPENSSL naming vcpkg's directory finds it there.
      - name: Without OpenSSL (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        env:
          OOSOCKETS_ONLINE: 1
        run: |
          w() { cygpath -w "$1"; }
          lib="$PWD/build/Release"
          alone="$RUNNER_TEMP/lib-alone"
          mkdir -p "$RUNNER_TEMP/none" "$alone"
          cp "$lib/oosockets.dll" "$lib/sockets.cls" "$alone/"
          none="$(w "$RUNNER_TEMP/none")"
          rc=0
          (export OOSOCKETS_OPENSSL="$none"
           export REXX_PATH="$(w "$alone");$(w "$PWD/tests");$(w "$PWD/tests/framework")" PATH="$alone:$PATH"
           rexx scripts/no-openssl.rex "$(w "$PWD/tests/certs")" windows || exit 1
           cd tests && rexx run.rex Socket ServerSocket UDPSocket MulticastSocket TLSSocket TLSServerSocket) || rc=1
          (export OOSOCKETS_OPENSSL="$(w "$OPENSSL_BIN")" OOSOCKETS_TLS=openssl
           export REXX_PATH="$(w "$alone");$(w "$PWD/tests");$(w "$PWD/tests/framework")" PATH="$alone:$PATH"
           cd tests && rexx run.rex TLSSocket DTLSSocket) || rc=1
          exit $rc

      # OOSOCKETS_OPENSSL (Linux): a directory without OpenSSL 3 is an error
      # that names it; the system's directory, named so, works as always.
      - name: OOSOCKETS_OPENSSL (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          export REXX_PATH="$PWD/build:$PWD/tests:$PWD/tests/framework" LD_LIBRARY_PATH="$PWD/build"
          mkdir -p "$RUNNER_TEMP/none"
          rc=0
          OOSOCKETS_OPENSSL="$RUNNER_TEMP/none" rexx scripts/no-openssl.rex "$PWD/tests/certs" || rc=1
          dir="$(dirname "$(ldconfig -p | grep -m1 'libssl.so.3 .*x86-64' | sed 's/.*=> //')")"
          echo "the system's OpenSSL: $dir"
          (cd tests && OOSOCKETS_OPENSSL="$dir" rexx run.rex TLSSocket DTLSSocket) || rc=1
          exit $rc

      # macOS without OpenSSL 3 (Homebrew's hidden): the library still loads,
      # the plain sockets work, and TLS says what to install; and
      # OOSOCKETS_OPENSSL, naming a copy of Homebrew's somewhere else, finds it.
      - name: Without OpenSSL (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          o="$(brew --prefix)/opt/openssl@3"
          mkdir -p "$RUNNER_TEMP/ossl"
          cp "$o/lib/libssl.3.dylib" "$o/lib/libcrypto.3.dylib" "$RUNNER_TEMP/ossl/"
          sudo mv "$o" "$o.hidden"
          export REXX_PATH="$PWD/build:$PWD/tests:$PWD/tests/framework" DYLD_LIBRARY_PATH="$PWD/build"
          rc=0
          rexx scripts/no-openssl.rex "$PWD/tests/certs/" || rc=1
          (cd tests && rexx run.rex Socket ServerSocket UDPSocket MulticastSocket) || rc=1   # Halt has TLS tests
          (cd tests && OOSOCKETS_OPENSSL="$RUNNER_TEMP/ossl" rexx run.rex TLSSocket) || rc=1
          sudo mv "$o.hidden" "$o"
          exit $rc
